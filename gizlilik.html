h_anket:{tr:"Anket hakkında ayrıntı",en:"About the poll",de:"Details zur Umfrage",it:"Dettagli sul sondaggio",fr:"À propos du sondage"},
anket1:{
 tr:"Ankette bir seçenek işaretleyip oyunuzu gönderdiğinizde, sunucu IP adresinizi gizli bir anahtarla birleştirip geri döndürülemez bir özete çevirir ve yalnızca bu özeti saklar. Amaç, aynı kişinin tekrar oy kullanıp kullanmadığını anlamaktır. IP adresinizin kendisi kaydedilmez ve özetten IP adresine geri dönülemez.",
 en:"When you select an option and send your vote, the server combines your IP address with a secret key, turns it into an irreversible digest and stores only that digest. The purpose is to tell whether the same person has already voted. The IP address itself is not stored and cannot be recovered from the digest.",
 de:"Wenn Sie eine Option wählen und Ihre Stimme absenden, verbindet der Server Ihre IP-Adresse mit einem geheimen Schlüssel, wandelt sie in einen nicht umkehrbaren Hashwert um und speichert nur diesen. Zweck ist festzustellen, ob dieselbe Person bereits abgestimmt hat. Die IP-Adresse selbst wird nicht gespeichert und lässt sich aus dem Hashwert nicht rekonstruieren.",
 it:"Quando selezioni un'opzione e invii il voto, il server combina il tuo indirizzo IP con una chiave segreta, lo trasforma in un digest irreversibile e conserva solo quello. Lo scopo è capire se la stessa persona ha già votato. L'indirizzo IP non viene memorizzato e non è ricavabile dal digest.",
 fr:"Lorsque vous choisissez une option et envoyez votre vote, le serveur combine votre adresse IP avec une clé secrète, la transforme en une empreinte irréversible et ne conserve que celle-ci. L'objectif est de savoir si la même personne a déjà voté. L'adresse IP elle-même n'est pas enregistrée et ne peut être retrouvée à partir de l'empreinte."},
anket2:{
 tr:"Bu yöntemin bilinen bir sınırı vardır: aynı ağı paylaşan kişiler (aynı ev, iş yeri veya operatör ağı) tek bir oy hakkına takılabilir. Anketin amacı bilimsel bir ölçüm değil, taraftar eğilimini görmektir.",
 en:"This method has a known limitation: people sharing a network (the same home, workplace or mobile operator) may be limited to a single vote between them. The poll is not a scientific measurement; it is there to show the mood among fans.",
 de:"Diese Methode hat eine bekannte Grenze: Personen, die sich ein Netzwerk teilen (gleicher Haushalt, Arbeitsplatz oder Mobilfunkanbieter), können zusammen auf eine Stimme beschränkt sein. Die Umfrage ist keine wissenschaftliche Messung, sondern zeigt die Stimmung unter den Fans.",
 it:"Questo metodo ha un limite noto: le persone che condividono una rete (stessa casa, luogo di lavoro o operatore mobile) potrebbero disporre di un solo voto complessivo. Il sondaggio non è una misurazione scientifica, ma mostra l'umore dei tifosi.",
 fr:"Cette méthode a une limite connue : les personnes partageant un réseau (même domicile, lieu de travail ou opérateur mobile) peuvent se retrouver limitées à un seul vote. Le sondage n'est pas une mesure scientifique ; il montre l'état d'esprit des supporters."},

const DIL = (() => {
  const a = new URLSearchParams(location.search).get("lang");
  if (DILLER.includes(a)) { try { localStorage.setItem("dil", a); } catch(e){} return a; }
  try { const k = localStorage.getItem("dil"); if (DILLER.includes(k)) return k; } catch(e){}
  const t = (navigator.language || "tr").slice(0,2).toLowerCase();
  return DILLER.includes(t) ? t : "tr";
})();

const S = k => (M[k] && (M[k][DIL] || M[k].tr)) || "";

document.querySelectorAll("[data-s]").forEach(el => { el.textContent = S(el.dataset.s); });
document.documentElement.lang = DIL;
document.title = S("baslik") + " — tedescofenere.com";

const dillerEl = document.getElementById("diller");
dillerEl.innerHTML = DILLER.map(k =>
  `<button type="button" lang="${k}" data-dil="${k}" aria-current="${k === DIL}"
     title="${DIL_ADI[k]}">${k}</button>`).join("");
dillerEl.addEventListener("click", e => {
  const b = e.target.closest("button");
  if(!b) return;
  try { localStorage.setItem("dil", b.dataset.dil); } catch(err){}
  const u = new URL(location.href);
  u.searchParams.set("lang", b.dataset.dil);
  location.href = u.toString();
});

/* Ana sayfaya dönüş bağlantısı seçili dili korusun */
const geriBag = document.querySelector(".geri");
if(geriBag && DIL !== "tr") geriBag.href = "/?lang=" + DIL;
</script>
