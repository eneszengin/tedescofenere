name: Fikstürü güncelle

# DEVRE DIŞI. Bu iş API-Football'u kullanıyor ve ücretsiz plan 2026 sezonunu
# kapsamadığı için her çalışmada hata veriyordu. Yerini "Günlük skor kontrolü"
# (gunluk.yml) aldı; o Mackolik arşivinden okuyor ve anahtar istemiyor.
# Zamanlayıcı kaldırıldı, yalnızca elle çalıştırılabilir durumda bırakıldı.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli paketler
        run: pip install requests

      - name: Fikstürü çek ve index.html'i güncelle
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 scripts/guncelle.py

      - name: Değişiklik varsa commit'le
        run: |
          if [[ -z "$(git status --porcelain index.html)" ]]; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi
          git config user.name  "fikstur-bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Fikstür güncellendi ($(date +%d.%m.%Y))"
          git push
