name: Günlük skor kontrolü

on:
  schedule:
    # Her gün 22:00 UTC = Türkiye saatiyle gece 01:00.
    # (Türkiye yıl boyu UTC+3, yaz saati uygulaması yok — kayma olmaz.)
    # Akşam maçları ~23:50'de biter, 01:00 kontrolü aynı geceye yetişir.
    - cron: "0 22 * * *"
  workflow_dispatch:        # "Run workflow" düğmesiyle elle de çalıştırılabilir
    inputs:
      sinama:
        description: "Yalnızca kaynağa erişimi sına (dosyaya dokunmaz)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Elle çalıştırma ile zamanlı çalışma çakışıp aynı dosyaya iki kez
  # yazmaya çalışmasın.
  group: gunluk-skor
  cancel-in-progress: false

jobs:
  skorlar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli paketler
        run: pip install requests beautifulsoup4

      - name: Kaynağa erişimi sına
        if: inputs.sinama
        run: python3 scripts/gunluk.py --sinama

      - name: Skoru bekleyen maç var mı, varsa doldur
        if: ${{ !inputs.sinama }}
        run: |
          set -o pipefail
          if ! python3 scripts/gunluk.py 2>&1 | tee gunluk.log; then
            # Gerekçeyi ek nota (annotation) taşı: GitHub günlüğünü API'den
            # okumak mümkün değil, ek notlar okunabiliyor.
            while IFS= read -r satir; do
              [[ -n "$satir" ]] && echo "::error title=gunluk.py::$satir"
            done < <(grep -E '^(HATA|SINAMA|   -)' gunluk.log | head -12)
            echo "::error title=gunluk.py son satırlar::$(tail -3 gunluk.log | tr '\n' ' ')"
            exit 1
          fi
          cat gunluk.log

      - name: Değişiklik varsa commit'le
        if: ${{ !inputs.sinama }}
        run: |
          if [[ -z "$(git status --porcelain index.html sitemap.xml)" ]]; then
            echo "Değişiklik yok, commit atlanmadı — bu normal."
            exit 0
          fi
          git config user.name  "skor-bot"
          git config user.email "actions@github.com"
          git add index.html sitemap.xml
          git commit -m "Skorlar güncellendi ($(date +%d.%m.%Y))"
          # Bu arada başka bir commit geldiyse üstüne bindirmeden tekrar dene.
          for i in 1 2 3; do
            git push && exit 0
            echo "Push reddedildi, rebase edip tekrar deneniyor ($i/3)"
            git pull --rebase origin main || exit 1
          done
          exit 1

      # Fikstürde hiç olmayan oynanmış maç bulunduysa (kupa kurası çekilmiş
      # olabilir) işi kasten kırmızı yakıyoruz. Skorlar yukarıda zaten
      # commit'lendi; bu adım sadece GitHub'ın e-posta atmasını sağlıyor.
      - name: Elle eklenmesi gereken maç var mı
        if: ${{ !inputs.sinama }}
        run: |
          if [[ -f .yeni-mac-uyarisi ]]; then
            cat .yeni-mac-uyarisi
            # Her satırı kendi ek notuna yaz, yoksa hangi maç olduğu
            # yalnızca günlükte kalıyor ve API'den okunamıyor.
            while IFS= read -r satir; do
              [[ -n "$satir" ]] && \
                echo "::error title=Fikstüre elle eklenecek maç::$satir"
            done < .yeni-mac-uyarisi
            exit 1
          fi
          echo "Fikstür dışı maç yok."
